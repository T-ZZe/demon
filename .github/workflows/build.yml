name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChainsawRPG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ChainsawRPG/pom.xml
      - name: Valider YAML et code
        run: pip install pyyaml && python3 tools/validate_configs.py
      - name: Compiler
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@v4
        with:
          name: ChainsawRPG-jar
          path: ChainsawRPG/target/ChainsawRPG-*.jar

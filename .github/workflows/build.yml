name: Build DemonPact
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DemonPact/DemonPact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: DemonPact/DemonPact/pom.xml
      - name: Compilation
        run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: DemonPact
          path: DemonPact/DemonPact/target/DemonPact.jar
